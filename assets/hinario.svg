<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Hinário IASD - macOS App" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a30"/>
      <stop offset="1" stop-color="#111518"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a94f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d489"/>
      <stop offset="1" stop-color="#b98a2e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6eedb"/>
      <stop offset="1" stop-color="#e2d4b4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- staff lines -->
  <g stroke="#d4a94f" stroke-opacity="0.10" stroke-width="2">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
  </g>

  <!-- frame -->
  <rect x="24" y="24" width="1232" height="592" rx="18" fill="none" stroke="#d4a94f" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="36" y="36" width="1208" height="568" rx="12" fill="none" stroke="#d4a94f" stroke-opacity="0.15" stroke-width="1"/>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif">
    <text x="90" y="250" font-size="30" letter-spacing="8" fill="#d4a94f" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-weight="600">APLICAÇÃO PARA macOS</text>
    <text x="86" y="350" font-size="92" fill="#f6eedb" font-weight="700">Hinário IASD</text>
    <line x1="90" y1="382" x2="330" y2="382" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <text x="90" y="438" font-size="32" fill="#aab4bb" font-style="italic">Reprodutor de hinos em ecrã completo</text>
  </g>

  <!-- chips -->
  <g font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="600">
    <rect x="90" y="480" width="196" height="46" rx="23" fill="#d4a94f" fill-opacity="0.14" stroke="#d4a94f" stroke-opacity="0.6"/>
    <text x="188" y="511" text-anchor="middle" fill="#f0d489">Apple Silicon</text>
    <rect x="302" y="480" width="120" height="46" rx="23" fill="none" stroke="#aab4bb" stroke-opacity="0.5"/>
    <text x="362" y="511" text-anchor="middle" fill="#cfd6db">Electron</text>
    <rect x="438" y="480" width="156" height="46" rx="23" fill="none" stroke="#aab4bb" stroke-opacity="0.5"/>
    <text x="516" y="511" text-anchor="middle" fill="#cfd6db">Licença ISC</text>
  </g>

  <!-- open book -->
  <g transform="translate(179,60) scale(0.88)">
    <ellipse cx="960" cy="486" rx="230" ry="22" fill="#000" fill-opacity="0.35"/>
    <!-- cover -->
    <path d="M740 300 Q850 270 960 310 Q1070 270 1180 300 L1180 462 Q1070 436 960 474 Q850 436 740 462 Z" fill="#7a5a1c"/>
    <!-- left page -->
    <path d="M752 290 Q856 262 960 300 L960 462 Q856 428 752 452 Z" fill="url(#page)"/>
    <!-- right page -->
    <path d="M1168 290 Q1064 262 960 300 L960 462 Q1064 428 1168 452 Z" fill="url(#page)"/>
    <!-- spine shadow -->
    <path d="M960 300 L960 462" fill="none" stroke="#b9a578" stroke-width="3"/>
    <!-- text lines left -->
    <g fill="none" stroke="#b9a578" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M786 330 Q860 312 930 338"/>
      <path d="M786 356 Q860 338 930 364"/>
      <path d="M786 382 Q860 364 930 390"/>
      <path d="M786 408 Q860 390 930 416"/>
    </g>
    <!-- staff on right page -->
    <g fill="none" stroke="#9c8a5f" stroke-width="2" opacity="0.9">
      <path d="M990 338 Q1070 316 1138 336"/>
      <path d="M990 350 Q1070 328 1138 348"/>
      <path d="M990 362 Q1070 340 1138 360"/>
      <path d="M990 374 Q1070 352 1138 372"/>
      <path d="M990 386 Q1070 364 1138 384"/>
    </g>
    <g fill="#5b4413">
      <ellipse cx="1030" cy="372" rx="9" ry="6.5" transform="rotate(-20 1030 372)"/>
      <ellipse cx="1072" cy="350" rx="9" ry="6.5" transform="rotate(-20 1072 350)"/>
      <ellipse cx="1112" cy="364" rx="9" ry="6.5" transform="rotate(-20 1112 364)"/>
      <rect x="1037" y="326" width="2.5" height="46"/>
      <rect x="1079" y="304" width="2.5" height="46"/>
      <rect x="1119" y="318" width="2.5" height="46"/>
    </g>
    <!-- gold ribbon -->
    <path d="M1000 458 L1000 520 L1012 508 L1024 520 L1024 450 Z" fill="url(#gold)"/>
  </g>

  <!-- floating notes -->
  <g fill="url(#gold)">
    <g transform="translate(940,150)">
      <ellipse cx="0" cy="60" rx="16" ry="12" transform="rotate(-20 0 60)"/>
      <rect x="12" y="-14" width="5" height="72"/>
      <path d="M17 -14 Q52 4 44 40 Q40 18 17 10 Z"/>
    </g>
    <g transform="translate(1070,110)">
      <ellipse cx="0" cy="60" rx="14" ry="10.5" transform="rotate(-20 0 60)"/>
      <ellipse cx="52" cy="48" rx="14" ry="10.5" transform="rotate(-20 52 48)"/>
      <rect x="10" y="-6" width="4.5" height="62"/>
      <rect x="62" y="-18" width="4.5" height="62"/>
      <path d="M10 -6 L66.5 -18 L66.5 -2 L10 10 Z"/>
    </g>
    <g transform="translate(1180,200)" opacity="0.7">
      <ellipse cx="0" cy="44" rx="11" ry="8.5" transform="rotate(-20 0 44)"/>
      <rect x="8" y="-8" width="4" height="50"/>
      <path d="M12 -8 Q38 4 32 28 Q28 12 12 6 Z"/>
    </g>
  </g>

  <!-- cross mark top-right -->
  <g fill="#d4a94f" opacity="0.55">
    <rect x="1195" y="62" width="6" height="34" rx="1"/>
    <rect x="1181" y="73" width="34" height="6" rx="1"/>
  </g>
</svg>
